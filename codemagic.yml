workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.yourapp.package"
    scripts:
      - name: Build Android Debug APK (system Gradle, no wrapper)
        script: |
          gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/**/*.apk
