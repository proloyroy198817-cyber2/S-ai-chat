workflows:
  android-workflow:
    name: Android ChatGPT Clone Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.example.chatgptclone"
    scripts:
      - name: Set up local.properties & Java
        script: |
          if [ -n "$JAVA_HOME_17" ]; then
            export JAVA_HOME="$JAVA_HOME_17"
          fi
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          elif [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          echo "Java version:"
          java -version
      - name: Ensure Gradle Wrapper JAR
        script: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Downloading official Gradle 8.7 wrapper jar..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          if [ -n "$JAVA_HOME_17" ]; then
            export JAVA_HOME="$JAVA_HOME_17"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - dev@example.com
        notify:
          failure: true
          success: true


